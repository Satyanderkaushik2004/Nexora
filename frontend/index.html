<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="NEXORA AI Router: multi-provider AI routing with automatic failover.">
<title>NEXORA AI Router</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/styles.css">
<script src="/static/vendor/marked.min.js" defer></script>
<script src="/static/vendor/purify.min.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-title">Chats</div>
  <input type="text" id="searchInput" class="search-input" placeholder="Search chats..." aria-label="Search chats">
  <div id="chatHistory" class="chat-history"></div>
  <button type="button" id="newChatBtn" class="new-chat-btn">+ New Chat</button>
</aside>

<main class="main">
  <header class="header">
    <div class="logo">NEXORA AI Router</div>
    <div class="header-actions">
      <div id="providerToggle" class="ai-toggle" role="group" aria-label="AI provider"></div>
      <button type="button" id="compareToggle" class="mode-toggle" aria-pressed="false">Compare Mode</button>
    </div>
  </header>

  <section class="chat" id="chat" aria-live="polite">
    <div class="empty-state" id="emptyState">
      <div class="loader-wrapper" aria-label="NEXORA">
        <span class="loader-letter">N</span>
        <span class="loader-letter">E</span>
        <span class="loader-letter">X</span>
        <span class="loader-letter">O</span>
        <span class="loader-letter">R</span>
        <span class="loader-letter">A</span>
        <div class="loader"></div>
      </div>
      <div class="empty-caption">NEXORA AI Router is ready</div>
      <div class="quick-actions">
        <button type="button" class="chip" data-prompt="Write code to ">⚡ Generate Code</button>
        <button type="button" class="chip" data-prompt="">💬 Ask Anything</button>
        <button type="button" class="chip" data-prompt="Research the latest on ">🔬 Research</button>
      </div>
    </div>
  </section>

  <div class="input-area">
    <textarea id="query" rows="1" placeholder="Ask anything..." class="chat-input" aria-label="Message"></textarea>
    <button type="button" id="micBtn" class="icon-btn" title="Voice input" aria-label="Voice input" hidden>🎙</button>
    <button type="button" id="sendBtn" class="send-btn" aria-label="Send message">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</main>

</body>
</html>
